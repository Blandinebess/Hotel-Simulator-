<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Simulator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { padding: 20px; background-color: #ae688f; }
        .guest-card { margin-top: 10px; padding: 10px; border: 1px solid #a4a0b8; border-radius: 8px; }
        .container { max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hotel Check-In</h2>

        <form id="checkInForm">
            <label for="guestName">guestName</label>
            <input type="text" id="guestName" placeholder="Guest Name" class="form-control my-2">
            <label for="roomNumber">Room Number</label>
            <input type="number" id="roomNumber" placeholder="Room Number" class="form-control my-2">
            <label for="stayDuration">Stay Duration</label>
            <input type="number" id="stayDuration" placeholder="Stay Duration (days)" class="form-control my-2">
            <label for="checkInDate">Check-In Date</label>
            <input type="date" id="checkInDate" class="form-control my-2">
            <button type="submit" class="btn btn-primary">Check In</button>
            <div id="errorMessage" class="text-danger mt-2"></div>
        </form>

        <h3 class="mt-4">Guest List</h3>
        <div id="guestList"></div>
         <div id="guestList">
            <div class="guest-card"><strong>Fouad</strong> - Room 304 -  Stay 3 days</div>
            <div class="guest-card"><strong>Eliora</strong> - Room 105 - stay 2 days</div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
